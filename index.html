<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Flux · Natural Gas Analytics</title>
<meta name="description" content="Henry Hub and Dutch TTF futures analytics: forward curve, contract lifecycles, calendar spreads, seasonality and settlement history.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/app.css">
<script>
  // Startup safety net (classic script, runs before the app module): any
  // error while the app starts is shown on the loading screen instead of a
  // spinner that never ends.
  window.__bootError = function (msg) {
    var b = document.getElementById('boot');
    if (!b || b.classList.contains('done')) return;
    var m = document.getElementById('boot-msg');
    if (m) { m.textContent = 'The dashboard could not start: ' + msg + ' — pull to refresh to retry.'; m.style.maxWidth = '320px'; m.style.textAlign = 'center'; }
  };
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href) && /lightweight-charts|fonts\./.test(t.src || t.href)) return;  // has fallbacks / optional
    if (t && t !== window && (t.src || t.href)) window.__bootError('could not download ' + (t.src || t.href).split('/').slice(-2).join('/'));
    else window.__bootError((e.message || 'script error') + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { window.__bootError(String(e.reason && e.reason.message || e.reason)); });
</script>
</head>
<body>
<div id="boot" role="status" aria-live="polite">
  <svg width="28" height="34" viewBox="0 0 100 120" aria-hidden="true"><path fill="#1f6feb" opacity=".7" d="M50 115Q15 105 15 65Q15 15 50 0Q85 15 85 65Q85 105 50 115Z"/><path fill="#4c9aff" d="M50 105Q30 98 30 70Q30 38 50 22Q70 38 70 70Q70 98 50 105Z"/><path fill="#e6ebf2" d="M50 100Q38 96 38 78Q38 58 50 46Q62 58 62 78Q62 96 50 100Z"/></svg>
  <div id="boot-msg">Loading market data…</div>
  <div class="bar"><i id="boot-bar"></i></div>
</div>

<header class="topbar">
  <a class="brand" href="#/overview" aria-label="Blue Flux overview">
    <svg viewBox="0 0 100 120" aria-hidden="true"><path fill="#1f6feb" opacity=".7" d="M50 115Q15 105 15 65Q15 15 50 0Q85 15 85 65Q85 105 50 115Z"/><path fill="#4c9aff" d="M50 105Q30 98 30 70Q30 38 50 22Q70 38 70 70Q70 98 50 105Z"/><path fill="#e6ebf2" d="M50 100Q38 96 38 78Q38 58 50 46Q62 58 62 78Q62 96 50 100Z"/></svg>
    Blue Flux <small>Natural Gas</small>
  </a>
  <nav class="views" id="nav" aria-label="Views"></nav>
  <div class="status" id="status"></div>
</header>

<main id="view" tabindex="-1"></main>
<footer class="site">
  <span>Data: NYMEX Henry Hub &amp; Dutch TTF futures via Yahoo Finance (hourly feed + daily archive), EIA Henry Hub spot; EURUSD via Yahoo Finance, Federal Reserve H.10 and ECB.</span>
  <span>Charts: <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a></span>
</footer>

<script type="module" src="src/js/app.js" onerror="window.__bootError('could not download the app code (src/js/app.js)')"></script>
<script nomodule>document.getElementById('boot-msg').textContent = 'This browser does not support JavaScript modules.';</script>
<script>
  // If the app module fails to load or parse, never leave the loading screen up silently.
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('done')) document.getElementById('boot-msg').textContent = 'Still loading… this is taking unusually long. Check your connection, then pull to refresh.';
  }, 15000);
</script>
</body>
</html>
