name: Refresh Live Quotes Feed

on:
  schedule:
    - cron: '0 * * * *'      # hourly; weekends are cheap no-ops (no diff, no commit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live quotes and EURUSD history
        run: python scripts/fetch_live_quotes.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json data/fx_eurusd.json
          if git diff --staged --quiet; then
            echo "No live quote changes"
          else
            git commit -m "chore: refresh live market quotes feed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
