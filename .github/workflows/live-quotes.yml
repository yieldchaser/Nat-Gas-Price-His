name: Refresh Live Quotes Feed

on:
  schedule:
    # Every 10 minutes while NYMEX gas trades (Sun 22:00 UTC -> Fri 22:00 UTC),
    # at off-peak minutes: GitHub delays or drops top-of-hour schedules (the old
    # '0 * * * *' job actually ran only every 5-8 hours). A run with no price
    # change writes nothing, so it neither commits nor redeploys Pages; ~6
    # deploys/hour stays under the GitHub Pages soft limit of 10 builds/hour.
    - cron: '4-59/10 * * * 1-4'
    - cron: '4-59/10 0-21 * * 5'
    - cron: '4-59/10 22-23 * * 0'
    # One weekend pass to pick up late corrections.
    - cron: '34 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch live quotes and EURUSD history
        run: python scripts/fetch_live_quotes.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_quotes.json data/latest.json data/fx_eurusd.json
          if git diff --staged --quiet; then
            echo "No live quote changes"
          else
            git commit -m "chore: refresh live market quotes feed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
