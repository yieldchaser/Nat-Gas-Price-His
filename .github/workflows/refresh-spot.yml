name: Refresh Spot Prices & FX History

on:
  schedule:
    # EIA publishes Henry Hub spot data weekly (usually Wednesday)
    - cron: '0 18 * * 3,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install xlrd

      - name: Fetch EIA spot data
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from build_data import build_spot_from_eia; build_spot_from_eia()"

      - name: Rebuild EURUSD history (Yahoo > FRED > ECB)
        run: python3 scripts/build_fx.py

      - name: Commit and push if data changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/spot.json data/fx_eurusd.json
          if git diff --staged --quiet; then
            echo "No spot data changes"
          else
            git commit -m "chore: refresh EIA spot prices and FX history $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi
