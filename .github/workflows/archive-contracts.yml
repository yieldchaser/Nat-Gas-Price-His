name: Archive Contracts & Rebuild Data

# Daily maintenance of the contract archive (see scripts/archive_contract.py):
#   1. merge everything in data/live_quotes.json into the CSV archive (no network)
#   2. fetch contracts missing from the trading window
#   3. re-fetch expired contracts whose history stops before their last trading day
#   4. rebuild data/hh.json and data/ttf.json

on:
  schedule:
    # After the NYMEX settlement (~19:30 UTC) so settled closes reach the
    # archive the same evening, and again early morning as a safety net.
    # Off-peak minutes: top-of-hour schedules are heavily delayed by GitHub.
    - cron: '41 21 * * 1-5'
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Archive, repair and rebuild
        run: python scripts/archive_contract.py --update

      - name: Validate datasets
        run: python -m unittest discover -s tests

      - name: Commit and push if data changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No contract data changes"
          else
            git commit -m "chore: auto-archive contract price history $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi
